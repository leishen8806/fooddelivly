<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img" aria-labelledby="title desc">
  <title id="title">Tea Cafe Telegram group order controls</title>
  <desc id="desc">Six states of a bot order card with sequential group buttons: accept, confirm payment, mark ready, mark delivered, and complete.</desc>
  <defs>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#25383D}.muted{fill:#71858A}.green{fill:#4C6971}.white{fill:#fff}.label{font-size:11px;font-weight:700;letter-spacing:1px}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.title{font-size:30px;font-weight:700}.screen{fill:#fff;stroke:#DCE5E8;stroke-width:1.2}.divider{stroke:#E1EAEC;stroke-width:1}.state{fill:#D9EEF5}.success{fill:#DDF0F4}.blue{fill:#E8F2F5}.danger{fill:#F8E9E7}
    </style>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#354B51" flood-opacity=".08"/></filter>
    <g id="grouphead"><rect width="520" height="48" rx="12" fill="#F0F5F6"/><circle cx="24" cy="24" r="14" fill="#4C6971"/><text x="24" y="29" class="tiny white" text-anchor="middle" font-weight="700">T</text><text x="49" y="22" class="small" font-weight="700">Tea Cafe Orders</text><text x="49" y="38" class="tiny muted">Telegram group · staff operations</text><text x="500" y="29" class="tiny muted" text-anchor="end">8 members</text></g>
    <g id="ordercard"><rect width="520" height="224" rx="13" class="screen"/><text x="18" y="26" class="tiny green" font-weight="700">TEA CAFE BOT　·　ORDER TC-8K4M</text><text x="18" y="54" class="body" font-weight="700">Room 508</text><text x="500" y="54" class="body" text-anchor="end" font-weight="700">$14.00</text><line x1="18" y1="67" x2="502" y2="67" class="divider"/><text x="18" y="91" class="small">Beef Lok Lak × 1</text><text x="18" y="113" class="small">Khmer Noodle Soup × 1</text><text x="18" y="143" class="tiny muted">Created 10:42　·　2 items</text><line x1="18" y1="159" x2="502" y2="159" class="divider"/></g>
  </defs>
  <rect width="1800" height="1210" fill="#F4F8F9"/>
  <text x="42" y="55" class="label green">TEA CAFE · TELEGRAM STAFF GROUP</text>
  <text x="42" y="98" class="title">One order card. Five controlled actions.</text>
  <text x="42" y="127" class="small muted">The Bot edits the same group post as the order advances. Every click is re-authorized on the server.</text>

  <!-- Stage 1 -->
  <g transform="translate(42 168)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="174" width="484" height="36" rx="9" fill="#4C6971"/><text x="260" y="197" class="small white" text-anchor="middle" font-weight="700">接单</text></g><rect x="0" y="331" width="62" height="23" rx="11" class="state"/><text x="31" y="347" class="tiny" text-anchor="middle" font-weight="700">01 NEW</text><text x="77" y="347" class="small" font-weight="700">Accept the order</text></g>
  <!-- Stage 2 -->
  <g transform="translate(626 168)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="166" width="484" height="24" rx="7" fill="#D9EEF5"/><text x="28" y="182" class="tiny" font-weight="700">Payment proof received privately · Check ABA actual credit</text><rect x="18" y="195" width="484" height="28" rx="8" fill="#3686A5"/><text x="260" y="214" class="tiny white" text-anchor="middle" font-weight="700">确认支付 · staff verifies first</text></g><rect x="0" y="331" width="91" height="23" rx="11" class="state"/><text x="45" y="347" class="tiny" text-anchor="middle" font-weight="700">02 ACCEPTED</text><text x="106" y="347" class="small" font-weight="700">Confirm real payment</text></g>
  <!-- Stage 3 -->
  <g transform="translate(1210 168)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="165" width="484" height="25" rx="7" fill="#DDF0F4"/><text x="28" y="182" class="tiny green" font-weight="700">Payment confirmed by staff · Preparing</text><rect x="18" y="195" width="484" height="28" rx="8" fill="#4C6971"/><text x="260" y="214" class="tiny white" text-anchor="middle" font-weight="700">出餐 · order is ready to leave kitchen</text></g><rect x="0" y="331" width="104" height="23" rx="11" class="success"/><text x="52" y="347" class="tiny green" text-anchor="middle" font-weight="700">03 PREPARING</text><text x="119" y="347" class="small" font-weight="700">Mark food ready</text></g>
  <!-- Stage 4 -->
  <g transform="translate(42 615)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="165" width="484" height="25" rx="7" fill="#DDF0F4"/><text x="28" y="182" class="tiny green" font-weight="700">出餐已完成 · Ready for delivery</text><rect x="18" y="195" width="484" height="28" rx="8" fill="#4C6971"/><text x="260" y="214" class="tiny white" text-anchor="middle" font-weight="700">已配送</text></g><rect x="0" y="331" width="67" height="23" rx="11" class="blue"/><text x="33" y="347" class="tiny" text-anchor="middle" font-weight="700">04 READY</text><text x="82" y="347" class="small" font-weight="700">Mark delivered</text></g>
  <!-- Stage 5 -->
  <g transform="translate(626 615)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="165" width="484" height="25" rx="7" fill="#DDF0F4"/><text x="28" y="182" class="tiny green" font-weight="700">已配送 · Room delivery recorded</text><rect x="18" y="195" width="484" height="28" rx="8" fill="#4C6971"/><text x="260" y="214" class="tiny white" text-anchor="middle" font-weight="700">已完成</text></g><rect x="0" y="331" width="95" height="23" rx="11" class="blue"/><text x="47" y="347" class="tiny" text-anchor="middle" font-weight="700">05 DELIVERED</text><text x="110" y="347" class="small" font-weight="700">Complete the order</text></g>
  <!-- Stage 6 -->
  <g transform="translate(1210 615)" filter="url(#drop)"><use href="#grouphead"/><g transform="translate(0 60)"><use href="#ordercard"/><rect x="18" y="165" width="484" height="42" rx="8" fill="#DDF0F4"/><text x="28" y="183" class="tiny green" font-weight="700">COMPLETED · Staff action recorded</text><text x="28" y="199" class="tiny muted">No further order action available.</text><text x="493" y="219" class="tiny muted" text-anchor="end">10:58</text></g><rect x="0" y="331" width="110" height="23" rx="11" class="success"/><text x="55" y="347" class="tiny green" text-anchor="middle" font-weight="700">06 COMPLETED</text><text x="125" y="347" class="small" font-weight="700">Terminal state</text></g>

  <rect x="42" y="1016" width="1716" height="142" rx="18" fill="#4C6971"/>
  <text x="70" y="1052" class="label" fill="#E2F1F5">ACCESS AND PAYMENT GUARDRAILS</text>
  <text x="70" y="1082" class="small white">Only active Tea Cafe staff can use buttons, and only in the configured group. Telegram group-admin status alone grants no access.</text>
  <text x="70" y="1108" class="small white">Payment screenshots stay in the customer Bot chat or protected admin view. The group card never exposes the image.</text>
  <text x="70" y="1134" class="small white">“确认支付” requires a submitted proof and actual ABA credit verification; duplicate clicks cannot advance the order twice.</text>
  <text x="42" y="1184" class="tiny muted">STATIC UI CONCEPT · Group message states and sample order details are illustrative.</text>
</svg>
