<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Tea Cafe role handoff and interaction states</title>
  <desc id="desc">Swimlane flow from guest Mini App to Telegram bot, backend, ABA actual payment, staff review and order fulfillment, including rejection and retry paths.</desc>
  <defs>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#25383D}.muted{fill:#71858A}.green{fill:#4C6971}.white{fill:#fff}.title{font-size:30px;font-weight:700}.lane{font-size:15px;font-weight:700}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.node{fill:#fff;stroke:#D9DFD6;stroke-width:1.5}.guest{fill:#E4F0F3;stroke:#7CA28A}.bot{fill:#F0F5F6;stroke:#96A6BC}.server{fill:#E6F0F2;stroke:#638475}.staff{fill:#D9EEF5;stroke:#C89A46}.danger{fill:#F8E9E7;stroke:#C77566}.line{stroke:#64777C;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64777C"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#26372F" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1800" height="1080" fill="#F4F8F9"/>
  <text x="42" y="54" class="tiny green" font-weight="700" letter-spacing="1.5">TEA CAFE · END-TO-END UI INTERACTION</text>
  <text x="42" y="97" class="title">Order → proof → human payment check → kitchen</text>
  <text x="42" y="125" class="small muted">The payment proof handoff is the trust boundary. A person verifies the actual incoming ABA transaction.</text>

  <!-- lane backgrounds -->
  <rect x="34" y="160" width="1730" height="164" rx="16" fill="#EEF4F5"/><rect x="34" y="334" width="1730" height="164" rx="16" fill="#F0F5F6"/><rect x="34" y="508" width="1730" height="164" rx="16" fill="#E4F0F3"/><rect x="34" y="682" width="1730" height="164" rx="16" fill="#FBF2E1"/>
  <rect x="48" y="178" width="112" height="30" rx="15" fill="#4C6971"/><text x="104" y="198" class="tiny white" text-anchor="middle" font-weight="700">GUEST</text>
  <rect x="48" y="352" width="112" height="30" rx="15" fill="#506982"/><text x="104" y="372" class="tiny white" text-anchor="middle" font-weight="700">MINI APP + BOT</text>
  <rect x="48" y="526" width="112" height="30" rx="15" fill="#466C5B"/><text x="104" y="546" class="tiny white" text-anchor="middle" font-weight="700">API + DATABASE</text>
  <rect x="48" y="700" width="112" height="30" rx="15" fill="#B07B25"/><text x="104" y="720" class="tiny white" text-anchor="middle" font-weight="700">ABA + STAFF</text>

  <!-- guest lane -->
  <g filter="url(#sh)"><rect x="191" y="204" width="168" height="75" rx="13" class="node guest"/><text x="275" y="231" class="small" text-anchor="middle" font-weight="700">Open bot</text><text x="275" y="253" class="tiny muted" text-anchor="middle">Mini App menu</text>
    <rect x="409" y="204" width="174" height="75" rx="13" class="node guest"/><text x="496" y="231" class="small" text-anchor="middle" font-weight="700">Choose food</text><text x="496" y="253" class="tiny muted" text-anchor="middle">Build cart</text>
    <rect x="631" y="204" width="182" height="75" rx="13" class="node guest"/><text x="722" y="231" class="small" text-anchor="middle" font-weight="700">Enter room only</text><text x="722" y="253" class="tiny muted" text-anchor="middle">Confirm order</text>
    <rect x="861" y="204" width="178" height="75" rx="13" class="node guest"/><text x="950" y="231" class="small" text-anchor="middle" font-weight="700">Pay with ABA</text><text x="950" y="253" class="tiny muted" text-anchor="middle">Scan merchant QR/link</text>
    <rect x="1087" y="204" width="189" height="75" rx="13" class="node guest"/><text x="1181" y="231" class="small" text-anchor="middle" font-weight="700">Send screenshot</text><text x="1181" y="253" class="tiny muted" text-anchor="middle">Bot chat · order linked</text>
    <rect x="1335" y="204" width="190" height="75" rx="13" class="node guest"/><text x="1430" y="231" class="small" text-anchor="middle" font-weight="700">Wait for review</text><text x="1430" y="253" class="tiny muted" text-anchor="middle">See order progress</text>
    <rect x="1574" y="204" width="160" height="75" rx="13" class="node guest"/><text x="1654" y="231" class="small" text-anchor="middle" font-weight="700">Receive order</text><text x="1654" y="253" class="tiny muted" text-anchor="middle">Room delivery</text></g>
  <path d="M359 241h47M583 241h45M813 241h45M1039 241h44M1276 241h55M1525 241h44" class="line"/>

  <!-- app and bot lane -->
  <g filter="url(#sh)"><rect x="191" y="377" width="187" height="78" rx="13" class="node bot"/><text x="284" y="405" class="small" text-anchor="middle" font-weight="700">Telegram identity</text><text x="284" y="428" class="tiny muted" text-anchor="middle">Send raw initData</text>
    <rect x="449" y="377" width="195" height="78" rx="13" class="node bot"/><text x="546" y="405" class="small" text-anchor="middle" font-weight="700">Mini App menu</text><text x="546" y="428" class="tiny muted" text-anchor="middle">Cart + room field</text>
    <rect x="707" y="377" width="198" height="78" rx="13" class="node bot"/><text x="806" y="405" class="small" text-anchor="middle" font-weight="700">Order receipt</text><text x="806" y="428" class="tiny muted" text-anchor="middle">Order code + amount</text>
    <rect x="970" y="377" width="195" height="78" rx="13" class="node bot"/><text x="1067" y="405" class="small" text-anchor="middle" font-weight="700">Bot deep link</text><text x="1067" y="428" class="tiny muted" text-anchor="middle">Bind proof to order</text>
    <rect x="1230" y="377" width="211" height="78" rx="13" class="node bot"/><text x="1335" y="405" class="small" text-anchor="middle" font-weight="700">Status message</text><text x="1335" y="428" class="tiny muted" text-anchor="middle">Paid / preparing / ready</text>
    <rect x="1504" y="377" width="230" height="78" rx="13" class="node bot"/><text x="1619" y="405" class="small" text-anchor="middle" font-weight="700">My orders / support</text><text x="1619" y="428" class="tiny muted" text-anchor="middle">Private to this Telegram user</text></g>
  <path d="M378 416h67M644 416h58M905 416h60M1165 416h61M1441 416h58" class="line"/>
  <path d="M1181 279v80" class="line"/>

  <!-- backend lane -->
  <g filter="url(#sh)"><rect x="191" y="551" width="187" height="78" rx="13" class="node server"/><text x="284" y="579" class="small" text-anchor="middle" font-weight="700">Verify signature</text><text x="284" y="602" class="tiny muted" text-anchor="middle">Check auth_date</text>
    <rect x="449" y="551" width="195" height="78" rx="13" class="node server"/><text x="546" y="579" class="small" text-anchor="middle" font-weight="700">Create order</text><text x="546" y="602" class="tiny muted" text-anchor="middle">Reprice on server</text>
    <rect x="707" y="551" width="198" height="78" rx="13" class="node server"/><text x="806" y="579" class="small" text-anchor="middle" font-weight="700">NEW + UNPAID</text><text x="806" y="602" class="tiny muted" text-anchor="middle">Snapshot items + amount</text>
    <rect x="970" y="551" width="195" height="78" rx="13" class="node server"/><text x="1067" y="579" class="small" text-anchor="middle" font-weight="700">ACCEPTED + PROOF</text><text x="1067" y="602" class="tiny muted" text-anchor="middle">Proof stays private</text>
    <rect x="1230" y="551" width="211" height="78" rx="13" class="node server"/><text x="1335" y="579" class="small" text-anchor="middle" font-weight="700">PAID + PREPARING</text><text x="1335" y="602" class="tiny muted" text-anchor="middle">Staff confirms actual ABA credit</text>
    <rect x="1504" y="551" width="230" height="78" rx="13" class="node server"/><text x="1619" y="579" class="small" text-anchor="middle" font-weight="700">READY → DELIVERED → DONE</text><text x="1619" y="602" class="tiny muted" text-anchor="middle">Group buttons, in order</text></g>
  <path d="M378 590h67M644 590h58M905 590h60M1165 590h61M1441 590h58" class="line"/>
  <path d="M284 455v90M546 455v90M806 455v90M1067 455v90M1335 455v90M1619 455v90" class="line dash"/>

  <!-- payment and manager -->
  <g filter="url(#sh)"><rect x="191" y="725" width="242" height="78" rx="13" class="node staff"/><text x="312" y="753" class="small" text-anchor="middle" font-weight="700">ABA incoming payment</text><text x="312" y="776" class="tiny muted" text-anchor="middle">Merchant account is source of truth</text>
    <rect x="491" y="725" width="248" height="78" rx="13" class="node staff"/><text x="615" y="753" class="small" text-anchor="middle" font-weight="700">Staff opens proof</text><text x="615" y="776" class="tiny muted" text-anchor="middle">Private Bot chat or admin detail</text>
    <rect x="800" y="725" width="246" height="78" rx="13" class="node staff"/><text x="923" y="753" class="small" text-anchor="middle" font-weight="700">Compare actual credit</text><text x="923" y="776" class="tiny muted" text-anchor="middle">Amount · account · time</text>
    <rect x="1110" y="725" width="266" height="78" rx="13" class="node staff"/><text x="1243" y="753" class="small" text-anchor="middle" font-weight="700">Group button or admin</text><text x="1243" y="776" class="tiny muted" text-anchor="middle">Confirm / reject · audit actor</text>
    <rect x="1440" y="725" width="294" height="78" rx="13" class="node staff"/><text x="1587" y="753" class="small" text-anchor="middle" font-weight="700">Kitchen / delivery updates</text><text x="1587" y="776" class="tiny muted" text-anchor="middle">Accepted → preparing → ready → complete</text></g>
  <path d="M433 764h54M739 764h57M1046 764h59M1376 764h59" class="line"/>
  <path d="M312 725v-88M615 725v-88M923 725v-88M1243 725v-88M1587 725v-88" class="line dash"/>

  <!-- exception branches -->
  <rect x="190" y="886" width="520" height="132" rx="16" fill="#F8E9E7" stroke="#D9897F"/>
  <text x="214" y="918" class="small" font-weight="700" fill="#9F493E">REJECTED OR MISMATCHED PROOF</text>
  <text x="214" y="946" class="small">Staff records a reason → payment stays unconfirmed → Bot tells guest</text>
  <text x="214" y="972" class="small">→ guest returns to payment instructions and sends a new proof.</text>
  <path d="M1243 803v51h-270v27" class="line"/>
  <path d="M193 953C130 953 132 415 185 415" class="line dash"/>
  <text x="54" y="680" class="tiny muted" transform="rotate(-90 54 680)">proof retry loop</text>

  <rect x="755" y="886" width="463" height="132" rx="16" fill="#FFF7E4" stroke="#75C3DE"/>
  <text x="779" y="918" class="small" font-weight="700">ORDER EXPIRES / GUEST CANCELS</text>
  <text x="779" y="946" class="small">Keep the order and any proof in audit history.</text>
  <text x="779" y="972" class="small">Do not count as confirmed receipts or enter the kitchen.</text>
  <path d="M806 629v175h-32v78" class="line dash"/>

  <rect x="1263" y="886" width="471" height="132" rx="16" fill="#E6F0F2" stroke="#9CB09E"/>
  <text x="1287" y="918" class="small" font-weight="700">ACCESS / NETWORK FAILURES</text>
  <text x="1287" y="946" class="small">Invalid/expired initData → reopen Mini App from Bot.</text>
  <text x="1287" y="972" class="small">No staff permission → block action and record safely.</text>
  <text x="42" y="1053" class="tiny muted">Solid arrows show the happy path. Dashed arrows show a server handoff or exception. Payment state is never inferred from a user-uploaded image.</text>
</svg>
