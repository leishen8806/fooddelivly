name: teacafe

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teacafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-teacafe}
      TZ: Asia/Phnom_Penh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teacafe} -d ${DB_NAME:-teacafe}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-teacafe}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-teacafe}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      MINI_APP_URL: ${MINI_APP_URL:-https://food.workline.ink/}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SQL_ECHO: ${SQL_ECHO:-false}
      UPLOAD_DIR: /var/lib/teacafe/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://food.workline.ink}
      TZ: Asia/Phnom_Penh
    volumes:
      - uploaded_images:/var/lib/teacafe/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uploaded_images:
